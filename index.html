<!DOCTYPE html>
<html lang="zh-Hant">
<div class="app">

  <header class="app-header">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#254c3d" />
    <link rel="stylesheet" href="src/styles/main.css" />
    <script src="src/ui/triggers.js" defer></script>
    <h1>我的任務 · Task Manager</h1>
    <p>今天也完成一點事情吧！</p>
  </header>

  <main>

    <!-- 新增任務區 -->
    <section class="add-task-section">
      <label for="taskInput">新增任務</label>

      <div class="input-group">
        <input
          id="taskInput"
          type="text"
          placeholder="例如：完成 JavaScript 練習"
        >

        <button class="add-btn">
          ＋ 新增
        </button>
      </div>
    </section>


    <!-- 篩選區 -->
    <section class="filter-section">
      <button class="filter-btn active">全部</button>
      <button class="filter-btn">未完成</button>
      <button class="filter-btn">已完成</button>
    </section>


    <!-- 任務清單 -->
    <section class="task-section">

      <ul class="task-list">
        <li class="task-item">
          <div class="task-content">
            <input type="checkbox">
            <span>完成 Web App 實作</span>
          </div>

          <button class="delete-btn">刪除</button>
        </li>


        <li class="task-item">
          <div class="task-content">
            <input type="checkbox">
            <span>完成 JavaScript 練習</span>
          </div>

          <button class="delete-btn">刪除</button>
        </li>


        <li class="task-item completed">
          <div class="task-content">
            <input type="checkbox" checked>
            <span>完成課程作業</span>
          </div>

          <button class="delete-btn">刪除</button>
        </li>

      </ul>

    </section>


    <!-- 統計資訊 -->
    <section class="stats-section">
      <span>共 <strong>3</strong> 項</span>
      <span>未完成 <strong>2</strong> 項</span>
      <span>已完成 <strong>1</strong> 項</span>
    </section>

  </main>

</div>
