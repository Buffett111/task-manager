<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#254c3d" />
    <link rel="stylesheet" href="src/styles/main.css" />
    <script type="module" src="src/ui/triggers.js"></script>
    <title>我的任務 · Task Manager</title>
</head>

<body>
<div class="app">
  <header class="app-header">
    <h1>我的任務 · Task Manager</h1>
    <p>今天也完成一點事情吧！</p>
  </header>
  <main>

    <!-- 新增任務區 -->
    <section class="add-task-section">
      <label for="taskInput">新增任務</label>

      <div class="input-group">
        <input
          id="taskInput" aria-describedby="taskFeedback"
          type="text"
          placeholder="例如：完成 JavaScript 練習"
        >

        <button type="button" class="add-btn">
          + 新增
        </button>
      </div>
    </section>


    <p id="taskFeedback" role="status" aria-live="polite" style="padding: 0 28px;"></p>

    <!-- 篩選區 -->
    <section class="filter-section">
      <button class="filter-btn active">全部</button>
      <button class="filter-btn">未完成</button>
      <button class="filter-btn">已完成</button>
    </section>


    <!-- 任務清單 -->
    <section class="task-section">

      <!-- 清單由 renderTasks() 依 tasks 陣列產生。 -->
      <ul class="task-list"></ul>

    </section>


    <!-- 統計資訊 -->
    <section class="stats-section">
      <span>共 <strong id="totalCount">3</strong> 項</span>
      <span>未完成 <strong id="pendingCount">2</strong> 項</span>
      <span>已完成 <strong id="completedCount">1</strong> 項</span>
    </section>

  </main>
</div>
</body>
</html>
